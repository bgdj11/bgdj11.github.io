<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>One actor runtime, two coordination designs</title><desc>Async mailboxes and actor references over local or framed TCP messages</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92c5dc"/></marker></defs><rect width="1000" height="650" fill="#0b151d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#e7eee9" font-size="30">One actor runtime, two coordination designs</text><text x="32" y="80" fill="#b6c8cd" font-size="20">Async mailboxes and actor references over local or framed TCP messages</text><rect x="32" y="110" width="450" height="450" rx="8" fill="#101e26" stroke="#3d5660" stroke-width="2"/><text x="52" y="142" fill="#b6c8cd" font-size="20">COORDINATED ROUNDS</text><rect x="518" y="110" width="450" height="450" rx="8" fill="#101e26" stroke="#3d5660" stroke-width="2"/><text x="538" y="142" fill="#b6c8cd" font-size="20">AUTONOMOUS GOSSIP</text><rect x="58" y="170" width="190" height="90" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="78" y="204" fill="#92c5dc" font-size="23">Provider</text><text x="78" y="237" fill="#e7eee9" font-size="20">Start round</text><rect x="274" y="170" width="182" height="90" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="294" y="204" fill="#92c5dc" font-size="23">Workers</text><text x="294" y="237" fill="#e7eee9" font-size="20">Local training</text><path d="M248 215H270" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="58" y="352" width="190" height="90" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="78" y="386" fill="#92c5dc" font-size="23">Evaluator</text><text x="78" y="419" fill="#e7eee9" font-size="20">Assess model</text><rect x="274" y="352" width="182" height="90" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="294" y="386" fill="#92c5dc" font-size="23">Aggregator</text><text x="294" y="419" fill="#e7eee9" font-size="20">FedAvg</text><path d="M365 260V348" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M274 397H252" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M153 352V265" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="58" y="505" fill="#aacba4" font-size="21">One shared round boundary</text><rect x="570" y="170" width="340" height="95" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="590" y="204" fill="#aacba4" font-size="23">Peer A</text><text x="590" y="237" fill="#e7eee9" font-size="20">Train • merge • publish</text><rect x="544" y="366" width="190" height="95" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="564" y="400" fill="#aacba4" font-size="23">Peer B</text><text x="564" y="433" fill="#e7eee9" font-size="20">Local view</text><rect x="756" y="366" width="190" height="95" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="776" y="400" fill="#aacba4" font-size="23">Peer C</text><text x="776" y="433" fill="#e7eee9" font-size="20">Local view</text><path d="M640 265V360" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M850 366V270" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M734 415H750" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="544" y="540" fill="#dec68b" font-size="20">LWWMap state + peer discovery</text><text x="544" y="505" fill="#aacba4" font-size="20">Independent clocks, temporary divergence</text><text x="32" y="607" fill="#b6c8cd" font-size="22">SQLite checkpoints support recovery; CRDT convergence is not model convergence.</text></g></svg>