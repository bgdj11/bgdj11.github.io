<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Message submission and live delivery</title><desc>Source flow — the broadcast boundary is an implementation limitation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92c5dc"/></marker></defs><rect width="1000" height="650" fill="#0b151d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#e7eee9" font-size="30">Message submission and live delivery</text><text x="32" y="80" fill="#b6c8cd" font-size="20">Source flow — the broadcast boundary is an implementation limitation</text><rect x="32" y="145" width="260" height="120" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="52" y="179" fill="#92c5dc" font-size="23">POST /api/messages</text><text x="52" y="212" fill="#e7eee9" font-size="20">Group ID + sender ID</text><text x="52" y="240" fill="#e7eee9" font-size="20">Message content</text><rect x="370" y="145" width="260" height="120" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="390" y="179" fill="#aacba4" font-size="23">Membership check</text><text x="390" y="212" fill="#e7eee9" font-size="20">Submitted sender</text><text x="390" y="240" fill="#e7eee9" font-size="20">belongs to group?</text><rect x="708" y="145" width="260" height="120" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="728" y="179" fill="#dec68b" font-size="23">Persist message</text><text x="728" y="212" fill="#e7eee9" font-size="20">Transactional save</text><text x="728" y="240" fill="#e7eee9" font-size="20">Map to response DTO</text><path d="M292 205H364" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M630 205H702" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="370" y="370" width="260" height="120" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="390" y="404" fill="#dec68b" font-size="23">WebSocket broadcast</text><text x="390" y="437" fill="#e7eee9" font-size="20">All open sessions</text><text x="390" y="465" fill="#e7eee9" font-size="20">No recipient filtering</text><path d="M838 265V430H637" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="32" y="370" width="260" height="120" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="52" y="404" fill="#92c5dc" font-size="23">JWT handshake</text><text x="52" y="437" fill="#e7eee9" font-size="20">Token validated</text><text x="52" y="465" fill="#e7eee9" font-size="20">Email in attributes</text><path d="M292 430H364" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="32" y="550" fill="#dec68b" font-size="21">Needed: bind the sender to the principal and scope delivery to group members.</text><text x="32" y="590" fill="#b6c8cd" font-size="20">The current membership check does not by itself provide private message delivery.</text></g></svg>