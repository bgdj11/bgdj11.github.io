<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img"><title>BunHub: application and integration boundaries</title><desc>Implemented components — architecture illustration, not a deployment benchmark</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92c5dc"/></marker></defs><rect width="1000" height="690" fill="#0b151d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#e7eee9" font-size="30">BunHub: application and integration boundaries</text><text x="32" y="80" fill="#b6c8cd" font-size="20">Implemented components — architecture illustration, not a deployment benchmark</text><rect x="32" y="135" width="250" height="120" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="52" y="169" fill="#92c5dc" font-size="23">Angular interface</text><text x="52" y="202" fill="#e7eee9" font-size="20">Posts, maps and chat</text><text x="52" y="230" fill="#e7eee9" font-size="20">HTTP + WebSocket</text><rect x="325" y="115" width="355" height="380" rx="8" fill="#101e26" stroke="#3d5660" stroke-width="2"/><text x="345" y="147" fill="#b6c8cd" font-size="20">SPRING BOOT APPLICATION</text><rect x="345" y="175" width="315" height="120" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="365" y="209" fill="#aacba4" font-size="23">Application services</text><text x="365" y="242" fill="#e7eee9" font-size="20">JWT / domain operations</text><text x="365" y="270" fill="#e7eee9" font-size="20">Posts, follows, chat</text><rect x="345" y="352" width="315" height="110" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="365" y="386" fill="#aacba4" font-size="23">Caches + scheduled work</text><text x="365" y="419" fill="#e7eee9" font-size="20">Trends / Ehcache</text><text x="365" y="447" fill="#e7eee9" font-size="20">Image maintenance</text><path d="M502 295V345" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="745" y="135" width="223" height="120" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="765" y="169" fill="#dec68b" font-size="23">PostgreSQL</text><text x="765" y="202" fill="#e7eee9" font-size="20">Persistent domain</text><text x="765" y="230" fill="#e7eee9" font-size="20">and chat state</text><path d="M282 200H338" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M660 220H738" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="745" y="365" width="223" height="120" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="765" y="399" fill="#92c5dc" font-size="23">Monitoring</text><text x="765" y="432" fill="#e7eee9" font-size="20">Micrometer</text><text x="765" y="460" fill="#e7eee9" font-size="20">Prometheus</text><path d="M660 245H710V425H738" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="32" y="365" width="250" height="120" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="52" y="399" fill="#dec68b" font-size="23">RabbitMQ</text><text x="52" y="432" fill="#e7eee9" font-size="20">Care locations in</text><text x="52" y="460" fill="#e7eee9" font-size="20">Promotions out</text><path d="M282 410H305V275H338" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="32" y="548" width="430" height="100" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="52" y="582" fill="#dec68b" font-size="23">Separate educational queue service</text><text x="52" y="615" fill="#e7eee9" font-size="20">In-memory FIFO → scheduled location poll</text><path d="M462 590H502V470" fill="none" stroke="#92c5dc" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="540" y="570" fill="#b6c8cd" font-size="21">WebSocket delivery is broadcast;</text><text x="540" y="603" fill="#b6c8cd" font-size="21">recipient isolation is incomplete.</text></g></svg>