<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#0d141c"/><text x="40" y="55" fill="#e7e5dd" font-family="Arial,sans-serif" font-size="30">From a suspicious page to supporting evidence</text><text x="40" y="88" fill="#aab8c6" font-family="Arial,sans-serif" font-size="19">CheckMate — source-based risk analysis</text><path d="M58 175h244v8h8v84h-8v8H58v-8h-8v-84h8z" fill="#15202b" stroke="#9bc3df" stroke-width="2"/><text x="70" y="214" fill="#9bc3df" font-family="Arial,sans-serif" font-size="23">Website or query</text><text x="70" y="245" fill="#bac3ce" font-family="Arial,sans-serif" font-size="17">Browser extension / web app</text><path d="M310 225L375 225" stroke="#9bc3df" stroke-width="3" fill="none"/><rect x="371" y="221" width="8" height="8" fill="#9bc3df"/><path d="M383 175h234v8h8v84h-8v8H383v-8h-8v-84h8z" fill="#15202b" stroke="#a4cba6" stroke-width="2"/><text x="395" y="214" fill="#a4cba6" font-family="Arial,sans-serif" font-size="23">Relevant discussions</text><text x="395" y="245" fill="#bac3ce" font-family="Arial,sans-serif" font-size="17">Semantic retrieval</text><path d="M625 225L690 225" stroke="#9bc3df" stroke-width="3" fill="none"/><rect x="686" y="221" width="8" height="8" fill="#9bc3df"/><path d="M698 175h244v8h8v84h-8v8H698v-8h-8v-84h8z" fill="#15202b" stroke="#cfb77c" stroke-width="2"/><text x="710" y="214" fill="#cfb77c" font-family="Arial,sans-serif" font-size="23">Contextual analysis</text><text x="710" y="245" fill="#bac3ce" font-family="Arial,sans-serif" font-size="17">LLM-assisted assessment</text><path d="M383 365h234v8h8v84h-8v8H383v-8h-8v-84h8z" fill="#15202b" stroke="#baaad8" stroke-width="2"/><text x="395" y="404" fill="#baaad8" font-family="Arial,sans-serif" font-size="23">Page signals</text><text x="395" y="435" fill="#bac3ce" font-family="Arial,sans-serif" font-size="17">Content and HTML checks</text><path d="M625 415L820 275" stroke="#9bc3df" stroke-width