<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Coordinated training: explicit round state</title><desc>Actors exchange model messages; each worker retains its local samples</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92c5dc"/></marker></defs><rect width="1000" height="650" fill="#0b151d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#e7eee9" font-size="30">Coordinated training: explicit round state</text><text x="32" y="80" fill="#b6c8cd" font-size="20">Actors exchange model messages; each worker retains its local samples</text><rect x="32" y="145" width="240" height="120" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="52" y="179" fill="#92c5dc" font-size="23">Provider</text><text x="52" y="212" fill="#e7eee9" font-size="20">Start round</text><text x="52" y="240" fill="#e7eee9" font-size="20">Distribute model</text><rect x="380" y="145" width="240" height="120" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="400" y="179" fill="#aacba4" font-size="23">Workers</text><text x="400" y="212" fill="#e7eee9" font-size="20">Train local partitions</text><text x="400" y="240" fill="#e7eee9" font-size="20">Return model + count</text><rect x="728" y="145" width="240" height="120" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="748" y="179" fill="#dec68b" font-size="23">Aggregator</text><text x="748" y="212" fill="#e7eee9" font-size="20">Sample-weighted</text><text x="748" y="240" fill="#e7eee9" font-size="20">FedAvg</text><path d="M272 200H374" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M620 200H722" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="380" y="365" width="240" height="120" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="400" y="399" fill="#aacba4" font-size="23">Local feature data</text><text x="400" y="432" fill="#e7eee9" font-size="20">Independent partitions</text><text x="400" y="460" fill="#e7eee9" font-size="20">No sample exchange</text><path d="M500 365V272" fill="none" stroke="#aacba4" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="728" y="365" width="240" height="120" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="748" y="399" fill="#dec68b" font-size="23">Evaluator</text><text x="748" y="432" fill="#e7eee9" font-size="20">Evaluate aggregate</text><text x="748" y="460" fill="#e7eee9" font-size="20">Record round</text><path d="M848 265V358" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M848 485V520H150V272" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="195" y="505" fill="#92c5dc" font-size="21">Next round</text><text x="32" y="576" fill="#e7eee9" font-size="23">The orchestration path owns progress through a round.</text><text x="32" y="613" fill="#b6c8cd" font-size="20">Worker updates are weighted by sample count; evaluation is a separate actor.</text></g></svg>