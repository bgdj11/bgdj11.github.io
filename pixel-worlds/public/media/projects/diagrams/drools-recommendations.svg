<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Rule-scored recommendation routes</title><desc>Routing depends on friend or authored-post activity — scores are not learned</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92c5dc"/></marker></defs><rect width="1000" height="650" fill="#0b151d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#e7eee9" font-size="30">Rule-scored recommendation routes</text><text x="32" y="80" fill="#b6c8cd" font-size="20">Routing depends on friend or authored-post activity — scores are not learned</text><rect x="290" y="125" width="420" height="85" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="310" y="159" fill="#92c5dc" font-size="23">Friends OR authored posts?</text><path d="M390 210V260H245V298" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M610 210V260H755V298" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="95" y="265" fill="#aacba4" font-size="22">Yes → BASE</text><text x="775" y="265" fill="#dec68b" font-size="22">No → NEW</text><rect x="32" y="305" width="430" height="220" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="52" y="339" fill="#aacba4" font-size="23">Existing-user signals</text><text x="52" y="372" fill="#e7eee9" font-size="20">Recent post (within 24 h)</text><text x="52" y="400" fill="#e7eee9" font-size="20">Liked / authored hashtags</text><text x="52" y="428" fill="#e7eee9" font-size="20">Popular post / popular hashtag</text><text x="52" y="456" fill="#e7eee9" font-size="20">Popular + liked-tag combination</text><rect x="538" y="305" width="430" height="220" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="558" y="339" fill="#dec68b" font-size="23">New-user signals</text><text x="558" y="372" fill="#e7eee9" font-size="20">Similar user: score ≥ 0.5</text><text x="558" y="400" fill="#e7eee9" font-size="20">Liked-post overlap: ratio ≥ 0.7</text><text x="558" y="428" fill="#e7eee9" font-size="20">Explicit rule contributions</text><text x="558" y="456" fill="#e7eee9" font-size="20">Candidate score + reasons</text><text x="32" y="576" fill="#e7eee9" font-size="22">Discovery guard: exclude self and friend authors.</text><text x="32" y="614" fill="#b6c8cd" font-size="22">Separate friends-feed rule: exclude blocked authors.</text></g></svg>