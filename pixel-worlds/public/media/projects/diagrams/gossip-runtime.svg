<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Asynchronous peer state exchange</title><desc>No central round barrier; each peer aggregates the models it currently knows</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92c5dc"/></marker></defs><rect width="1000" height="650" fill="#0b151d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#e7eee9" font-size="30">Asynchronous peer state exchange</text><text x="32" y="80" fill="#b6c8cd" font-size="20">No central round barrier; each peer aggregates the models it currently knows</text><rect x="330" y="135" width="340" height="120" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="350" y="169" fill="#aacba4" font-size="23">Peer A</text><text x="350" y="202" fill="#e7eee9" font-size="20">Local training + LWWMap</text><text x="350" y="230" fill="#e7eee9" font-size="20">Model keyed by peer ID</text><rect x="32" y="360" width="350" height="120" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="52" y="394" fill="#aacba4" font-size="23">Peer B</text><text x="52" y="427" fill="#e7eee9" font-size="20">Local training + LWWMap</text><text x="52" y="455" fill="#e7eee9" font-size="20">SQLite snapshot</text><rect x="618" y="360" width="350" height="120" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="638" y="394" fill="#aacba4" font-size="23">Peer C</text><text x="638" y="427" fill="#e7eee9" font-size="20">Local training + LWWMap</text><text x="638" y="455" fill="#e7eee9" font-size="20">SQLite snapshot</text><path d="M395 255L260 353" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M738 360L605 262" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M382 420H611" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="402" y="407" fill="#dec68b" font-size="21">State merge</text><text x="32" y="535" fill="#92c5dc" font-size="21">Bootstrap: seed endpoints → join messages → peer information in gossip</text><text x="32" y="576" fill="#b6c8cd" font-size="20">LWWMap: Lamport time + replica ID resolve writes; tombstones retain deletes.</text><text x="32" y="613" fill="#b6c8cd" font-size="20">PNCounter merges replicated counters. An optional reporter observes; it does not lead.</text></g></svg>