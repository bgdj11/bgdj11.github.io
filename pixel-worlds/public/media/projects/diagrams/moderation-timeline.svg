<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Temporal policy: more than five reports in 24 hours</title><desc>Illustrative event times — not a recorded user incident</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92c5dc"/></marker></defs><rect width="1000" height="650" fill="#0b151d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#e7eee9" font-size="30">Temporal policy: more than five reports in 24 hours</text><text x="32" y="80" fill="#b6c8cd" font-size="20">Illustrative event times — not a recorded user incident</text><rect x="32" y="125" width="936" height="245" rx="8" fill="#101e26" stroke="#3d5660" stroke-width="2"/><text x="52" y="157" fill="#b6c8cd" font-size="20">TRAILING WINDOW AT EVALUATION TIME</text><path d="M80 270H920" stroke="#92c5dc" stroke-width="3"/><circle cx="140" cy="270" r="8" fill="#dec68b"/><text x="110" y="237" fill="#e7eee9" font-size="19">23 h ago</text><text x="122" y="312" fill="#e7eee9" font-size="20">R1</text><circle cx="280" cy="270" r="8" fill="#dec68b"/><text x="250" y="237" fill="#e7eee9" font-size="19">19 h ago</text><text x="262" y="312" fill="#e7eee9" font-size="20">R2</text><circle cx="420" cy="270" r="8" fill="#dec68b"/><text x="390" y="237" fill="#e7eee9" font-size="19">15 h ago</text><text x="402" y="312" fill="#e7eee9" font-size="20">R3</text><circle cx="560" cy="270" r="8" fill="#dec68b"/><text x="530" y="237" fill="#e7eee9" font-size="19">11 h ago</text><text x="542" y="312" fill="#e7eee9" font-size="20">R4</text><circle cx="700" cy="270" r="8" fill="#dec68b"/><text x="670" y="237" fill="#e7eee9" font-size="19">7 h ago</text><text x="682" y="312" fill="#e7eee9" font-size="20">R5</text><circle cx="840" cy="270" r="8" fill="#dec68b"/><text x="810" y="237" fill="#e7eee9" font-size="19">3 h ago</text><text x="822" y="312" fill="#e7eee9" font-size="20">R6</text><text x="80" y="351" fill="#b6c8cd" font-size="19">24 hours ago</text><text x="852" y="351" fill="#b6c8cd" font-size="19">Now</text><path d="M500 370V420" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="125" y="430" width="750" height="115" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="145" y="464" fill="#aacba4" font-size="23">6 matching events &gt; 5 → posting restricted for 24 h</text><text x="145" y="497" fill="#e7eee9" font-size="20">Output includes a reason, posting scope and expiry time.</text><text x="100" y="600" fill="#b6c8cd" font-size="21">Five events do not trigger this rule. Other policies may activate independently.</text></g></svg>