<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#0d141c"/><text x="40" y="55" fill="#e7e5dd" font-family="Arial,sans-serif" font-size="30">Rules that explain their decisions</text><text x="40" y="88" fill="#aab8c6" font-family="Arial,sans-serif" font-size="19">An example from the implemented moderation policy</text><path d="M53 190h249v8h8v84h-8v8H53v-8h-8v-84h8z" fill="#15202b" stroke="#9bc3df" stroke-width="2"/><text x="65" y="229" fill="#9bc3df" font-family="Arial,sans-serif" font-size="23">Reports accumulate</text><text x="65" y="260" fill="#bac3ce" font-family="Arial,sans-serif" font-size="17">Within a 24-hour window</text><path d="M310 240L375 240" stroke="#9bc3df" stroke-width="3" fill="none"/><rect x="371" y="236" width="8" height="8" fill="#9bc3df"/><path d="M383 190h234v8h8v84h-8v8H383v-8h-8v-84h8z" fill="#15202b" stroke="#cfb77c" stroke-width="2"/><text x="395" y="229" fill="#cfb77c" font-family="Arial,sans-serif" font-size="23">More than 5 reports</text><text x="395" y="260" fill="#bac3ce" font-family="Arial,sans-serif" font-size="17">Threshold is crossed</text><path d="M625 240L690 240" stroke="#9bc3df" stroke-width="3" fill="none"/><rect x="686" y="236" width="8" height="8" fill="#9bc3df"/><path d="M698 190h249v8h8v84h-8v8H698v-8h-8v-84h8z" fill="#15202b" stroke="#baaad8" stroke-width="2"/><text x="710" y="229" fill="#baaad8" font-family="Arial,sans-serif" font-size="23">Posting restricted</text><text x="710" y="260" fill="#bac3ce" font-family="Arial,sans-serif" font-size="17">For the next 24 hours</text><text x="70" y="405" fill="#e7e5dd" font-family="Arial,sans-serif" font-size="24">Every flag carries a reason, a scope and an expiry time.</text><text x="70" y="448" fill="#bac3ce" font-family="Arial,sans-serif" font-size="19">Other rules handle blocks, repeat reports and login restrictions.</text></svg>