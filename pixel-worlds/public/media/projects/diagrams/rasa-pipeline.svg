<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img"><title>Rasa NLU and sentiment-conditioned dialogue</title><desc>Component order follows config.yml; the action consumes intent and emotion</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92c5dc"/></marker></defs><rect width="1000" height="670" fill="#0b151d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#e7eee9" font-size="30">Rasa NLU and sentiment-conditioned dialogue</text><text x="32" y="80" fill="#b6c8cd" font-size="20">Component order follows config.yml; the action consumes intent and emotion</text><rect x="32" y="115" width="575" height="470" rx="8" fill="#101e26" stroke="#3d5660" stroke-width="2"/><text x="52" y="147" fill="#b6c8cd" font-size="20">CONFIGURED NLU SEQUENCE</text><rect x="52" y="165" width="535" height="90" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="72" y="199" fill="#92c5dc" font-size="23">WhitespaceTokenizer → SpellChecker</text><text x="72" y="232" fill="#e7eee9" font-size="20">Dictionary substitution updates message text</text><path d="M320 255V280" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="52" y="287" width="535" height="90" rx="6" fill="#172831" stroke="#aacba4" stroke-width="2"/><text x="72" y="321" fill="#aacba4" font-size="23">EmotionAnalyzer: fine-tuned BERT</text><text x="72" y="354" fill="#e7eee9" font-size="20">Binary sentiment → message.emotion</text><path d="M320 377V402" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="52" y="410" width="535" height="140" rx="6" fill="#172831" stroke="#92c5dc" stroke-width="2"/><text x="72" y="444" fill="#92c5dc" font-size="23">CountVectors → DIET → ResponseSelector</text><text x="72" y="477" fill="#e7eee9" font-size="20">DIET provides the intent classification</text><text x="72" y="505" fill="#e7eee9" font-size="20">FallbackClassifier follows in the pipeline</text><rect x="682" y="240" width="285" height="125" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="702" y="274" fill="#dec68b" font-size="23">Custom action</text><text x="702" y="307" fill="#e7eee9" font-size="20">Read intent + emotion</text><text x="702" y="335" fill="#e7eee9" font-size="20">Choose response key</text><path d="M587 332H675" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M587 480H640V330H675" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="682" y="435" width="285" height="115" rx="6" fill="#172831" stroke="#dec68b" stroke-width="2"/><text x="702" y="469" fill="#dec68b" font-size="23">Predefined reply</text><text x="702" y="502" fill="#e7eee9" font-size="20">utter_&lt;intent&gt;_</text><text x="702" y="530" fill="#e7eee9" font-size="20">positive / negative</text><path d="M825 365V428" fill="none" stroke="#92c5dc" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="32" y="633" fill="#b6c8cd" font-size="23">BERT classifies sentiment; it does not generate the reply.</text></g></svg>